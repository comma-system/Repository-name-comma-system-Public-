<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>COMMA ONE</title>
<style>
  /* ==================================================================
     COMMA ONE 모바일 메인 화면 — 기준 이미지 측정값 기반 (설계 폭 390px)
     기준 이미지(855px 폭) 측정값 × 0.456 으로 환산한 고정 기준값.
     기준 viewport(390×844)에서 전체 콘텐츠가 한 화면에 들어온다.
     ================================================================== */
  :root {
    --page-bg: #f6f7f9;
    --card-bg: #ffffff;
    --dark-card-bg: #0c1a2c;
    --text-strong: #111827;
    --text-gray: #6b7280;
    --text-light-gray: #9ca3af;
    --green: #16a34a;
    --red: #ef4444;
    --blue: #2563eb;
    --border: #e5e7eb;
    --radius-card: 14px;
    --side-margin: 16px;
    --card-gap: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--page-bg); }
  body {
    line-height: 1.25; letter-spacing: -0.015em;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    color: var(--text-strong);
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 390px;
    margin: 0 auto;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: 70px; /* 하단 네비게이션 높이만큼 확보 */
  }

  /* ---------- 상단 헤더 ---------- */
  .header {
    display: flex; align-items: center;
    padding: 5px var(--side-margin) 6px;
  }
  .logo {
    /* 기준 이미지: 진한 네이비 블랙 단색 (그라디언트 아님) */
    font-size: 18px; font-weight: 800; letter-spacing: 0.5px;
    color: #101b2b;
  }
  .tagline { font-size: 11px; color: var(--text-gray); margin-left: 9px; flex: 1; }
  .header-icons { display: flex; align-items: center; gap: 15px; }
  .icon-btn { position: relative; width: 19px; height: 19px; }
  .icon-btn svg { width: 19px; height: 19px; display: block; }
  .badge {
    position: absolute; top: -5px; right: -6px;
    min-width: 13px; height: 13px; border-radius: 7px;
    background: var(--red); color: #fff; font-size: 8px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }

  /* ---------- 공통 카드 ---------- */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius-card);
    margin: 0 var(--side-margin) var(--card-gap);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }

  /* ---------- 1. 오늘의 시장 ---------- */
  .market-card { display: flex; gap: 10px; padding: 11px 12px; }
  /* 기준 이미지 좌우 비율: 좌측(상태+지표) 약 63%, 우측(업종) 약 37% */
  .market-left { flex: 1.7; min-width: 0; overflow: hidden; }
  .market-title-row { display: flex; align-items: center; gap: 6px; }
  .market-title { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .live-pill {
    display: inline-flex; align-items: center; gap: 3px;
    background: #f3f4f6; border-radius: 999px;
    font-size: 8.5px; color: var(--text-gray); padding: 3px 7px; white-space: nowrap;
  }
  .live-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); }
  .market-status { display: flex; align-items: center; gap: 5px; margin-top: 9px; white-space: nowrap; }
  .status-dot {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #4ade80, #16a34a);
  }
  .market-status b { font-size: 15px; font-weight: 800; }
  /* 좁은 화면에서만 축소 — 기준 viewport(390px)에는 영향 없음 */
  @media (max-width: 380px) {
    .market-status b { font-size: 13px; }
  }
  .market-status .hl { color: var(--green); }
  .market-stats { display: flex; gap: 5px; margin-top: 10px; }
  .stat-box {
    flex: 1; border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 2px 5px; text-align: center; background: #fff; min-width: 0; overflow: hidden;
  }
  .stat-label { font-size: 9px; color: var(--text-gray); white-space: nowrap; }
  .stat-value { font-size: 15.5px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
  .stat-sub { font-size: 7.5px; color: var(--text-light-gray); margin-top: 1px; white-space: nowrap; }
  .stat-dir { font-size: 9px; font-weight: 700; margin-top: 3px; color: var(--text-strong); white-space: nowrap; }
  .stat-dir .tri { color: var(--green); font-size: 8px; }
  .stat-amount { font-size: 11.5px; font-weight: 800; color: var(--red); margin-top: 2px; white-space: nowrap; }
  .market-right { flex: 1; min-width: 0; padding-top: 1px; }
  .sector-head { display: flex; align-items: center; justify-content: space-between; }
  .sector-title { font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .sector-chevron { color: #c4c9d1; font-size: 11px; }
  .sector-list { margin-top: 2px; margin-bottom: 4px; }
  .sector-row { display: flex; align-items: center; font-size: 10px; line-height: 1.15; padding: 1px 0; white-space: nowrap; }
  .sector-rank { width: 12px; color: var(--text-light-gray); flex: none; }
  .sector-name { flex: 1; color: #374151; overflow: hidden; text-overflow: ellipsis; }
  .sector-change { font-weight: 700; }
  .sector-change.up { color: var(--green); }
  .sector-change.down { color: var(--blue); }

  /* ---------- 2. 오늘의 포착 종목 ---------- */
  .pick-card {
    background: var(--dark-card-bg); color: #fff;
    border-radius: 16px; padding: 10px 12px; position: relative; overflow: hidden;
  }
  .pick-head { display: flex; align-items: center; }
  .pick-star {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    background: rgba(250, 204, 21, 0.15);
    display: flex; align-items: center; justify-content: center; margin-right: 6px;
  }
  .pick-title { font-size: 13px; font-weight: 700; flex: 1; line-height: 1.2; }
  .pick-more {
    font-size: 9.5px; color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.35);
    border-radius: 999px; padding: 2.5px 8px; white-space: nowrap; line-height: 1.2;
  }
  .pick-name-row { margin-top: 3px; display: flex; align-items: baseline; gap: 5px; }
  .pick-name { font-size: 18px; font-weight: 800; line-height: 1.1; }
  .pick-code { font-size: 12px; color: #8ea0b5; }
  .pick-price-row { display: flex; align-items: baseline; gap: 7px; margin-top: 3px; }
  .pick-price { font-size: 21px; font-weight: 800; line-height: 1.1; }
  .pick-change { font-size: 13px; font-weight: 800; color: #ff5252; }
  .pick-change.down { color: #6ba3ff; }
  .pick-chart { position: absolute; right: 12px; top: 38px; width: 100px; height: 44px; }
  .pick-chips { display: flex; gap: 5px; margin-top: 5px; }
  .pick-chip {
    background: #16283f; border-radius: 6px; padding: 3px 7px;
    font-size: 8.5px; line-height: 1.2; color: #93a5bb; white-space: nowrap;
  }
  .pick-chip b { color: #e6edf5; font-weight: 700; margin-left: 3px; }
  .pick-body { display: flex; align-items: center; gap: 11px; margin-top: 6px; }
  .gauge { width: 58px; height: 58px; position: relative; flex-shrink: 0; }
  .gauge svg { width: 58px; height: 58px; transform: rotate(-90deg); }
  .gauge-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .gauge-label { font-size: 7.5px; color: #8ea0b5; }
  .gauge-value { font-size: 15px; font-weight: 800; }
  .gauge-max { font-size: 7.5px; color: #8ea0b5; }
  .pick-right { flex: 1; min-width: 0; }
  .signal-box {
    display: inline-block; background: #0f3b2a; border: 1px solid rgba(34,197,94,0.35);
    color: #4ade80; font-size: 11.5px; font-weight: 700; line-height: 1.2;
    border-radius: 7px; padding: 4px 10px; white-space: nowrap;
  }
  /* 관망 상태 — PC GUI의 verdict-pill warn과 동일한 의미 */
  .signal-box.warn { background: #3a300e; border-color: rgba(250,204,21,0.35); color: #facc15; }
  .pick-desc { margin-top: 5px; font-size: 10px; line-height: 1.4; color: #b7c3d2; white-space: nowrap; }
  .zone-bar {
    display: flex; align-items: center; margin-top: 6px;
    background: #16283f; border-radius: 8px; padding: 4px 9px;
    font-size: 9.5px; line-height: 1.25;
  }
  .zone-pair { display: inline-flex; align-items: baseline; white-space: nowrap; }
  .zone-label-buy { color: #ff8a5c; font-weight: 700; margin-right: 4px; }
  .zone-label-target { color: #60a5fa; font-weight: 700; margin-right: 4px; }
  .zone-value { color: #e6edf5; font-weight: 600; }
  .zone-sep { color: #35507a; margin: 0 7px; }

  /* ---------- 3. 오늘의 추천 ---------- */
  .section-head {
    display: flex; align-items: baseline;
    margin: 1px var(--side-margin) 7px;
  }
  .section-title { font-size: 14px; font-weight: 700; }
  .section-sub { font-size: 10px; color: var(--text-gray); margin-left: 4px; flex: 1; }
  .section-more { font-size: 10px; color: var(--text-gray); white-space: nowrap; }
  .rec-row {
    display: flex; gap: 8px;
    padding: 0 var(--side-margin); margin-bottom: var(--card-gap);
    /* 추천은 5개 유형(콤마형 포함) — 기준 이미지처럼 4개가 화면에 보이고
       5번째 카드는 가로 스크롤로 이어진다. */
    overflow-x: auto; scrollbar-width: none;
  }
  .rec-row::-webkit-scrollbar { display: none; }
  .rec-card {
    /* 한 화면에 정확히 4개 (기준 이미지와 동일한 카드 폭 비율) */
    flex: 0 0 calc((100% - 24px) / 4); min-width: 0;
    background: #fff; border-radius: 11px;
    padding: 6px 7px 5px; box-shadow: 0 1px 3px rgba(15,23,42,0.04);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .rec-badge {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 8.5px; font-weight: 700; border-radius: 999px; padding: 2.5px 6px;
    white-space: nowrap;
  }
  .rec-badge.comma { background: #e8f0fe; color: #3182f6; }
  .rec-badge.safe { background: #dcfce7; color: #16a34a; }
  .rec-badge.aggressive { background: #ffedd5; color: #ea580c; }
  .rec-badge.inst { background: #ede9fe; color: #7c3aed; }
  .rec-badge.burst { background: #fee2e2; color: #dc2626; }
  .rec-name { font-size: 11px; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; }
  .rec-price { font-size: 9.5px; color: #374151; margin-top: 2px; white-space: nowrap; }
  .rec-score { font-size: 9.5px; font-weight: 700; margin-top: 2px; white-space: nowrap; }
  .rec-chart { width: 100%; height: 15px; margin-top: 3px; display: block; }

  /* ---------- 4. 검색 ---------- */
  .search-card { padding: 8px 12px 7px; }
  .search-title { font-size: 13px; font-weight: 700; line-height: 1.2; }
  .search-input {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 10px; margin-top: 5px; background: #fff;
  }
  .search-input span { font-size: 10.5px; color: var(--text-light-gray); white-space: nowrap; }
  .search-field {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
    font-size: 10.5px; color: var(--text-strong); font-family: inherit; padding: 0;
  }
  .search-field::placeholder { color: var(--text-light-gray); }
  .search-chips {
    display: flex; gap: 2px; margin-top: 5px; justify-content: space-between;
    overflow-x: auto; scrollbar-width: none;
  }
  .search-chips::-webkit-scrollbar { display: none; }
  .s-chip {
    flex: 0 0 auto; font-size: 7.2px; letter-spacing: -0.55px; color: #374151;
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 3.5px;
    background: #fff; white-space: nowrap; line-height: 1.2;
  }
  .s-chip.ai {
    background: #dbeafe; border-color: #dbeafe; color: var(--blue); font-weight: 700;
    display: inline-flex; align-items: center; gap: 2px;
  }

  /* ---------- 5. 오늘의 발굴 현황 ---------- */
  .discovery-card { padding: 8px 8px 8px; }
  .discovery-head { display: flex; align-items: center; padding: 0 2px; }
  .discovery-title { font-size: 13px; font-weight: 700; line-height: 1.2; }
  .info-icon {
    width: 12px; height: 12px; border-radius: 50%; border: 1px solid #c4c9d1;
    color: #c4c9d1; font-size: 8px; display: inline-flex; align-items: center;
    justify-content: center; margin-left: 4px; flex: none;
  }
  .discovery-head .spacer { flex: 1; }
  .discovery-steps { display: flex; align-items: flex-start; margin-top: 6px; }
  .step { flex: 1; text-align: center; min-width: 0; }
  .step-icon {
    width: 26px; height: 26px; border-radius: 50%; background: #eff6ff;
    display: flex; align-items: center; justify-content: center; margin: 0 auto;
  }
  .step.final .step-icon { background: #fee2e2; }
  .step-label { font-size: 8px; line-height: 1.15; color: var(--text-gray); margin-top: 3px; white-space: nowrap; }
  .step-count { font-size: 9.5px; line-height: 1.15; font-weight: 800; margin-top: 1px; white-space: nowrap; }
  .step.final .step-count { color: var(--green); }
  .step-arrow { color: var(--green); font-size: 10px; padding-top: 8px; flex: none; }

  /* ---------- 6. 오늘의 시장 브리핑 ---------- */
  .briefing-card {
    background: #e4f5e9; border-radius: var(--radius-card);
    margin: 0 var(--side-margin) var(--card-gap);
    padding: 9px 10px; display: flex; align-items: center; gap: 7px;
  }
  .briefing-left { flex: 1; min-width: 0; }
  .briefing-title { font-size: 11.5px; font-weight: 800; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .briefing-msg { font-size: 9px; color: #4b5563; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .briefing-illust { width: 38px; height: 32px; flex: none; }
  .briefing-btn {
    flex: none; background: var(--green); color: #fff; font-size: 10.5px; font-weight: 700;
    border-radius: 999px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 2px;
    white-space: nowrap;
  }

  /* ---------- 하단 네비게이션 ---------- */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-top: 1px solid #eceff3;
    padding: 6px 0 calc(4px + env(safe-area-inset-bottom, 6px));
    z-index: 10;
  }
  .bottom-nav-inner {
    max-width: 390px; margin: 0 auto;
    display: flex;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: #8a94a3;
  }
  .nav-item.active { color: var(--blue); }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-label { font-size: 8.5px; }
  .home-indicator {
    width: 120px; height: 4.5px; border-radius: 3px; background: #0f172a;
    margin: 6px auto 0;
  }

  /* ---------- 소형 기기 보호 (max-width 360px) ----------
     글자를 삭제하지 않고 줄바꿈/스크롤로 대응한다. 기준 390px 화면에는 영향 없음.
     주의: 기본 규칙을 덮어써야 하므로 반드시 스타일시트 마지막에 위치한다. */
  @media (max-width: 360px) {
    .market-status { white-space: normal; word-break: keep-all; }
    .rec-card { flex-basis: calc((100% - 16px) / 3); }
    .zone-bar { flex-wrap: wrap; row-gap: 2px; column-gap: 10px; }
    .zone-sep { display: none; }
    .briefing-msg { white-space: normal; overflow: visible; text-overflow: clip; }
    .step-label { white-space: normal; word-break: keep-all; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <script>
// =====================================================================
// COMMA ONE 모바일 메인 화면 데이터 계층
// UI(render.js)는 계산하지 않는다 — 모든 수치/판단은 이 계층(백엔드)에서 준비된다.
// 실제 서비스에서는 이 객체를 백엔드 API 응답으로 대체한다.
// =====================================================================
window.COMMA_DATA = {
  header: {
    logo: "COMMA",
    tagline: "오늘도 안전하게 투자하세요",
    notificationCount: 3,
  },

  market: {
    title: "오늘의 시장",
    liveLabel: "실시간",
    statusHighlight: "보통보다 강한",
    statusRest: " 시장입니다",
    stats: [
      { label: "시장강도", value: "82점", sub: "(100점 만점)" },
      { label: "외국인", direction: "▲ 순매수", value: "+2,532억" },
      { label: "기관", direction: "▲ 순매수", value: "+1,126억" },
    ],
    strongSectors: {
      title: "강한 업종 TOP 3",
      items: [
        { rank: 1, name: "반도체", change: "+2.31%" },
        { rank: 2, name: "전력/전기", change: "+1.85%" },
        { rank: 3, name: "조선", change: "+1.42%" },
      ],
    },
    weakSectors: {
      title: "약한 업종 TOP 3",
      items: [
        { rank: 1, name: "2차전지", change: "-1.25%" },
        { rank: 2, name: "바이오", change: "-0.98%" },
        { rank: 3, name: "건설", change: "-0.76%" },
      ],
    },
  },

  pick: {
    title: "오늘의 포착 종목",
    moreLabel: "자세히 보기",
    name: "삼성전자",
    code: "005930",
    price: "191,000원",
    change: "▲ 2.31%",
    chips: [
      { label: "거래대금", value: "8,532억" },
      { label: "거래량", value: "4,521만주" },
      { label: "시가총액", value: "1,140조" },
    ],
    score: { label: "콤마 점수", value: "82점", max: "/100", percent: 82 },
    signal: "지금 관심을 가져볼 자리",
    description: ["수급과 실적이 함께 좋아지는 구간", "상승 가능성이 높은 자리입니다."],
    buyZone: { label: "매수구간", value: "186,000 ~ 190,000원" },
    targetZone: { label: "목표구간", value: "205,000 ~ 215,000원" },
    // 미니 차트 좌표(0~100 정규화, 백엔드 가공 결과)
    chart: [12, 30, 22, 38, 30, 48, 40, 36, 52, 46, 62, 58, 74, 70, 86, 82, 95],
  },

  recommend: {
    title: "오늘의 추천",
    subtitle: "(투자 목적별)",
    moreLabel: "전체보기",
    // 오늘의 추천은 항상 5개 유형 전체를 유지한다 (콤마형 포함).
    // 기준 이미지에는 4개가 보이므로 앞 4개가 기준 화면 그대로 노출되고
    // 5번째(콤마형)는 가로 스크롤로 자연스럽게 이어진다.
    cards: [
      { type: "안전형", theme: "safe", icon: "shield", code: "000660", name: "SK하이닉스", price: "248,500원", score: "콤마 86점", chart: [20, 35, 28, 45, 38, 30, 42, 55, 48, 62, 58, 72] },

// 실데이터 매핑 계층 — /api/analyze 응답(백엔드 분석 결과)을 표시용 데이터로 변환.
// 점수/구간/판단 규칙은 PC GUI(public/index.html)와 완전히 동일하다.
// UI(render.js)는 이 결과를 그대로 표시만 한다.
// =====================================================================
(function () {
  const fmt = new Intl.NumberFormat("ko-KR");
  const roundPrice = (v) => Math.round(v / 100) * 100;

  // 캔들 종가 → 0~100 정규화 좌표 (차트 표시용)
  function normalize(closes) {
    const min = Math.min(...closes), max = Math.max(...closes);
    const span = max - min || 1;
    return closes.map((c) => ((c - min) / span) * 100);
  }

  // 콤마 점수 — PC GUI의 commaScore와 동일
  window.COMMA_SCORE = function (r) {
    let s = 0;
    s += Math.min(50, Number(r.strength) * 0.5);
    if (r.clean) s += 15;
    if (r.breakout) s += 20;
    if (r.flow === "매수 우위") s += 15;
    else if (r.flow === "중립") s += 7;
    return Math.round(s);
  };

  // 포착 종목 카드 데이터 — PC GUI의 renderHero와 동일한 매핑
  window.COMMA_MAP_PICK = function (r) {
    const prev = window.COMMA_DATA.pick;
    const closes = r.candles.map((c) => c.close);
    const totalVol = r.candles.reduce((a, c) => a + c.volume, 0);
    const totalAmt = r.candles.reduce((a, c) => a + c.volume * c.close, 0);
    const score = window.COMMA_SCORE(r);

    let change = prev.change, changeDown = false;
    if (r.prevClose) {
      const pct = ((r.current - r.prevClose) / r.prevClose) * 100;
      changeDown = pct < 0;
      change = (pct >= 0 ? "▲ " : "▼ ") + Math.abs(pct).toFixed(2) + "%";
    }

    const ok = r.result !== "진입 금지";
    const unmet = [
      r.clean ? null : "노이즈",
      r.breakout ? null : "돌파",
      Number(r.strength) >= 60 ? null : "체결강도",
      r.flow === "매수 우위" ? null : "수급",
    ].filter(Boolean).join(" · ");

    return {
      ...prev,
      code: r.code,
      name: r.name,
      price: fmt.format(r.current) + "원",
      change,
      changeDown,
      chips: [
        { label: "거래대금", value: fmt.format(Math.round(totalAmt / 1e8)) + "억" },
        { label: "거래량", value: fmt.format(Math.round(totalVol / 10000)) + "만주" },
        prev.chips[2], // 시가총액: API 미제공 — PC GUI와 동일하게 기존 값 유지
      ],
      score: { ...prev.score, value: score + "점", percent: score },
      signal: ok ? "지금 관심을 가져볼 자리" : "지금은 지켜볼 자리",
      signalWarn: !ok,
      description: ok
        ? ["수급과 실적이 함께 좋아지는 구간", "상승 가능성이 높은 자리입니다."]
        : ["진입 조건(" + unmet + ")이", "아직 충족되지 않았습니다."],
      buyZone: { label: "매수구간", value: fmt.format(roundPrice(r.current * 0.975)) + " ~ " + fmt.format(roundPrice(r.current * 0.995)) + "원" },
      targetZone: { label: "목표구간", value: fmt.format(roundPrice(r.current * 1.07)) + " ~ " + fmt.format(roundPrice(r.current * 1.12)) + "원" },
      chart: normalize(closes),
    };
  };

  // 추천 카드 데이터 — PC GUI의 loadReco와 동일한 매핑
  window.COMMA_MAP_RECO = function (card, r) {
    return {
      ...card,
      price: fmt.format(r.current) + "원",
      score: "콤마 " + window.COMMA_SCORE(r) + "점",
      chart: normalize(r.candles.map((c) => c.close)),
    };
  };
})();

  function chartPoints(values, w, h, pad) {
    const p = pad || 2;
    const step = (w - p * 2) / (values.length - 1);
    return values
      .map((v, i) => `${(p + i * step).toFixed(1)},${(h - p - ((h - p * 2) * v) / 100).toFixed(1)}`)
      .join(" ");

        </div>
      </div>`;

    // ---------- 5. 오늘의 발굴 현황 ----------
    const steps = D.discovery.steps
      .map(
        (s, i) => `
        ${i > 0 ? `<span class="step-arrow">→</span>` : ""}
        <div class="step${s.final ? " final" : ""}">
          <div class="step-icon">${ICONS[s.icon]}</div>
          <div class="step-label">${s.label}</div>
          <div class="step-count">${s.count}</div>
        </div>`
      )
      .join("");
    const discoveryCard = `
      <div class="card discovery-card">
        <div class="discovery-head">
          <span class="discovery-title">${D.discovery.title}</span>
          <span class="info-icon">i</span>
          <span class="spacer"></span>
          <span class="section-more">${D.discovery.moreLabel} ›</span>
        </div>
        <div class="discovery-steps">${steps}</div>
      </div>`;

    // ---------- 6. 오늘의 시장 브리핑 ----------
    const B = D.briefing;
    const briefingCard = `
      <div class="briefing-card">
        <div class="briefing-left">
          <div class="briefing-title">${ICONS.chartMini} ${B.title}</div>
          <div class="briefing-msg">${B.message}</div>
        </div>
        <svg class="briefing-illust" viewBox="0 0 44 38">
          <rect x="14" y="2" width="22" height="30" rx="3" fill="#fff" stroke="#bfe8cc"/>
          <rect x="18" y="8" width="14" height="2.5" rx="1" fill="#cfe3d7"/>
          <rect x="18" y="13" width="10" height="2.5" rx="1" fill="#cfe3d7"/>
          <rect x="18" y="18" width="12" height="2.5" rx="1" fill="#cfe3d7"/>
          <rect x="4" y="22" width="4" height="12" rx="1" fill="#22c55e"/>
          <rect x="10" y="18" width="4" height="16" rx="1" fill="#4ade80"/>
          <rect x="16" y="26" width="4" height="8" rx="1" fill="#86efac"/>
        </svg>
        <span class="briefing-btn">${B.buttonLabel} ›</span>
      </div>`;

    // ---------- 하단 네비게이션 ----------
    const nav = `
      <div class="bottom-nav">
        <div class="bottom-nav-inner">
          ${D.nav
            .map(
              (n) => `
            <div class="nav-item${n.active ? " active" : ""}">
              ${ICONS[n.icon]}
              <span class="nav-label">${n.label}</span>
            </div>`
            )
            .join("")}
        </div>
        <div class="home-indicator"></div>
      </div>`;

    app.innerHTML = header + marketCard + pickCard + recSection + searchCard + discoveryCard + briefingCard + nav;

    // ---------- 기능 연결 (기존 백엔드 /api/analyze — PC GUI와 동일 동작) ----------
    // 추천 카드 탭 → 포착 종목 카드에서 해당 종목 분석
    app.querySelectorAll(".rec-card").forEach((el) => {
      el.addEventListener("click", () => loadPick(el.dataset.code));
    });
    // 검색: 6자리 종목 코드 입력 시 분석 (PC GUI와 동일)
    const field = app.querySelector(".search-field");
    field.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && /^\d{6}$/.test(field.value.trim())) {
        loadPick(field.value.trim());
        field.blur();
      }
    });
  }

  // ---------- 실데이터 로딩 (서버로 서빙될 때만 동작, 실패 시 기본값 유지) ----------
  const isHttp = location.protocol === "http:" || location.protocol === "https:";

  async function apiAnalyze(code) {
    const res = await fetch("/api/analyze?code=" + encodeURIComponent(code));
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "분석 실패");
    return body;
  }

  async function loadPick(code) {
    if (!isHttp) return;
    try {
      window.COMMA_DATA.pick = window.COMMA_MAP_PICK(await apiAnalyze(code));
      renderApp();
    } catch (e) {
      // 조회 실패 시 현재 표시(기본값) 유지 — PC GUI와 동일한 정책
    }
  }

  async function loadRecoAll() {
    const cards = window.COMMA_DATA.recommend.cards;
    let changed = false;
    await Promise.all(
      cards.map(async (c, i) => {
        try {
          cards[i] = window.COMMA_MAP_RECO(c, await apiAnalyze(c.code));
          changed = true;
        } catch (e) {
          // 실패한 카드는 기본값 유지
        }
      })
    );
    if (changed) renderApp();
  }

  renderApp();
  if (isHttp) {
    loadPick(window.COMMA_DATA.pick.code);
    loadRecoAll();
  }
})();

</script>
</body>
</html>
